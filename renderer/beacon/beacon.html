<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: transparent; overflow: hidden; width: 100%; height: 100%; }
#beacon {
  /* solid widget: 97% opaque dark pill — always hittable on Windows */
  /* v1.8 信标状态：有未收尾待办时胶囊常显「N 件未收尾」——--bw 由 JS 按状态
     设置，hover 用 max() 保证展开宽度不被内联宽度压住 */
  width: var(--bw, 64px); height: 26px;
  margin: 8px auto 0;
  position: relative;
  border-radius: 13px;
  background: linear-gradient(180deg, rgba(50, 48, 58, 0.97), rgba(33, 32, 40, 0.97));
  border: 1px solid rgba(255, 170, 60, 0.35);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.07);
  cursor: pointer;
  /* v1.6: 子元素绝对定位后宽度过渡不再挤压变形（R165 的 flex 挤压根因已除）
     ——展开恢复平滑弹簧，label 淡入，不再"啪"地变形成黑条 */
  transition: width 220ms cubic-bezier(0.26, 1.2, 0.48, 1), box-shadow 200ms ease, border-color 200ms ease;
  overflow: hidden;
}
/* 窄胶囊太阳居中；status 态（常显状态文字）太阳靠左、文字常亮 */
#beacon .sun { position: absolute; left: 50%; top: 50%; margin: -7.5px 0 0 -7.5px; transition: left 220ms cubic-bezier(0.26, 1.2, 0.48, 1), transform 160ms cubic-bezier(0.26, 1.4, 0.48, 1); }
#beacon.status .sun { left: 21px; }
#beacon .label {
  position: absolute; left: calc(50% + 15px); top: 50%; transform: translateY(-50%) translateX(-6px);
  font-size: 11px; font-weight: 700; color: rgba(255, 232, 190, 1);
  white-space: nowrap; opacity: 0;
  transition: opacity 150ms ease 60ms, transform 150ms ease 60ms;
}
#beacon.status .label { left: 36px; opacity: 1; transform: translateY(-50%); transition: none; }
#beacon:hover {
  width: max(var(--bw, 64px), 118px);
  border-color: rgba(255, 180, 80, 0.55);
  box-shadow: 0 3px 12px rgba(0, 0, 0, 0.4), 0 0 14px rgba(255, 165, 60, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.08);
}
/* 今日清零：金边 + 静态柔光（呼吸类动画在该窗口会拖慢桌面合成，保持静态） */
#beacon[data-state="done"] {
  border-color: rgba(255, 205, 110, 0.8);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35), 0 0 12px rgba(255, 190, 80, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.07);
}
#beacon[data-state="done"] .label { color: rgba(255, 236, 200, 1); }
@media (prefers-color-scheme: dark) {
  #beacon .label { color: rgba(255, 225, 180, 1); }
  #beacon { background: rgba(24, 24, 30, 0.97); border-color: rgba(255, 170, 60, 0.5); }
}
#beacon::after {
  /* +8px hit ring: fixed pseudo escapes the pill's overflow:hidden clip and
     covers the whole window; 1% alpha keeps it hittable on Windows */
  content: ''; position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.01);
}
#beacon:hover .label { opacity: 1; transform: translateY(-50%) translateX(0); transition: opacity 160ms ease 110ms, transform 160ms ease 110ms; }
/* 拖文件悬于信标上：胶囊铺满窗口高亮，提示"松手挂到绳上" */
#beacon.dropping {
  width: 160px;
  border-color: rgba(255, 185, 90, 0.9);
  box-shadow: 0 0 0 3px rgba(255, 165, 60, 0.35), 0 4px 16px rgba(0, 0, 0, 0.45);
}
#beacon.dropping .label { opacity: 1; transform: translateY(-50%) translateX(0); color: rgba(255, 236, 200, 1); }

.sun {
  width: 15px; height: 15px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #ffe9a8, #ffb14a 60%, #ff8f1f);
  /* static glow: zero repaints while idle (animations here stuttered the desktop) */
  box-shadow: 0 0 7px 2px rgba(255, 160, 50, 0.75);
  display: flex; align-items: center; justify-content: center;
  transition: transform 160ms cubic-bezier(0.26, 1.4, 0.48, 1);
}
#beacon:hover .sun { transform: scale(1.3); box-shadow: 0 0 12px 4px rgba(255, 170, 60, 0.95); }
.rays { display: none; }
/* time-of-day hue — one class per load from beacon.js; static shadow (no
   idle animation: prior rounds found glow animations stuttered the desktop) */
body.dawn  .sun { background: radial-gradient(circle at 35% 35%, #ffe7ef, #ffbf8a 60%, #ff8d7a); box-shadow: 0 0 7px 2px rgba(255, 165, 135, 0.75); }
body.day   .sun { background: radial-gradient(circle at 35% 35%, #ffe9a8, #ffb14a 60%, #ff8f1f); box-shadow: 0 0 7px 2px rgba(255, 160, 50, 0.75); }
body.dusk  .sun { background: radial-gradient(circle at 35% 35%, #ffd9a3, #ff8a3d 60%, #ff5722); box-shadow: 0 0 8px 2px rgba(255, 110, 50, 0.80); }
body.night .sun { background: radial-gradient(circle at 35% 35%, #eef4ff, #b4c8e6 60%, #8aa6d6); box-shadow: 0 0 7px 2px rgba(170, 200, 255, 0.70); }
@media (prefers-color-scheme: dark) {
  #beacon { background: linear-gradient(180deg, rgba(30, 29, 36, 0.97), rgba(20, 20, 26, 0.97)); border-color: rgba(255, 170, 60, 0.5); }
}
@media (prefers-reduced-motion: reduce) {
  #beacon { transition: none; }
}
body.power-save .sun { transform: none !important; }
body.power-save .rays { display: none !important; }
</style>
</head>
<body>
  <div id="beacon" title="SunMemo · 点击展开晾衣绳" role="button" aria-label="展开晾衣绳">
    <div class="rays" style="display:none"></div>
    <div class="sun">☀️</div>
    <span class="label">晾衣绳</span>
  </div>
  <script src="beacon.js"></script>
</body>
</html>
